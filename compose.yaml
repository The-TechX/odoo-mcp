services:
  odoo-mcp:
    build: .
    stdin_open: true
    tty: false
    ports:
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"
    environment:
      ODOO_URL: ${ODOO_URL:?Set ODOO_URL in .env or the shell}
      ODOO_API_KEY: ${ODOO_API_KEY:?Set ODOO_API_KEY in .env or the shell}
      ODOO_TIMEOUT_MS: ${ODOO_TIMEOUT_MS:-10000}
      ODOO_MCP_MODE: ${ODOO_MCP_MODE:-read-only}
      ODOO_DATABASE: ${ODOO_DATABASE:-}
      ODOO_MCP_ALLOW_MODELS: ${ODOO_MCP_ALLOW_MODELS:-}
      ODOO_MCP_DENY_MODELS: ${ODOO_MCP_DENY_MODELS:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HTTP_HOST: ${MCP_HTTP_HOST:-127.0.0.1}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-3000}
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-}
