name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose
        env:
          ODOO_URL: https://odoo.example.invalid
          ODOO_API_KEY: ci-placeholder
        run: docker compose config --quiet
      - name: Build image
        env:
          ODOO_URL: https://odoo.example.invalid
          ODOO_API_KEY: ci-placeholder
        run: docker compose build
