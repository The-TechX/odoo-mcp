services:
  integration-db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  integration-odoo:
    image: odoo:19
    depends_on:
      integration-db:
        condition: service_healthy
    environment:
      HOST: integration-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:18069:8069"
